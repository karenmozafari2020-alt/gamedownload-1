<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Karen Download</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101010;color:#fff;font-family:Arial,sans-serif}
.box{width:90%;max-width:430px;padding:30px;text-align:center;background:#1b1b1b;border-radius:20px;box-shadow:0 10px 40px #0008}
h1{margin-top:0}.file{margin:25px 0;padding:20px;background:#252525;border-radius:15px}
.name{font-size:20px;font-weight:bold}.size{margin-top:8px;color:#aaa}
button{width:100%;padding:15px;border:0;border-radius:12px;background:#fff;color:#111;font-size:18px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.98)}
.status{margin-top:15px;color:#aaa;font-size:13px}
</style>
</head>
<body>
<div class="box">
  <h1>📦 Karen Download</h1>
  <div class="file">
    <div class="name" id="name">RA-GRAPHICS.zip</div>
    <div class="size" id="size">در حال دریافت اطلاعات...</div>
  </div>
  <button onclick="downloadFile()">⬇️ دانلود فایل</button>
  <div class="status" id="status">فایل از سرور دانلود می‌شود.</div>
</div>
<script>
async function loadInfo(){
  try{
    const r=await fetch("/api/file");
    const d=await r.json();
    document.getElementById("name").textContent=d.name;
    document.getElementById("size").textContent=formatSize(d.size);
  }catch(e){
    document.getElementById("size").textContent="اطلاعات فایل در دسترس نیست";
  }
}
function formatSize(bytes){
  if(bytes<1024) return bytes+" B";
  if(bytes<1024*1024) return (bytes/1024).toFixed(1)+" KB";
  return (bytes/1024/1024).toFixed(2)+" MB";
}
function downloadFile(){
  document.getElementById("status").textContent="دانلود شروع شد...";
  window.location.href="/download";
}
loadInfo();
</script>
</body>
</html>
